services:
  app:
    build:
      context: .
      target: development
    init: true
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: "${NODE_ENV-development}"
      PORT: "3000"
      DEBUG: "${DEBUG-express-app:server}"
      DATABASE_URL: "postgresql://express:express@db:5432/express_app"
      IEC104_HOST: "${IEC104_HOST:-}"
      IEC104_PORT: "${IEC104_PORT:-}"
    depends_on:
      initialize:
        condition: service_completed_successfully
    volumes:
      - ./server/src:/app/server/src:ro
      - prisma_client:/app/server/src/generated/prisma
      - ./server/views:/app/server/views:ro
      - ./server/public:/app/server/public:ro
      - ./server/tests:/app/server/tests:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.PORT + '/users').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: .
      target: frontend
    init: true
    environment:
      NUXT_API_BASE: "http://app:3000"
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3002}:3002"
    depends_on:
      app:
        condition: service_healthy

  initialize:
    build:
      context: .
      target: development
    working_dir: /app/server
    command: ["sh", "-c", "node scripts/auth-seed.ts && node scripts/equipment-import.ts --initial"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "postgresql://express:express@db:5432/express_app"
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      target: development
    command: ["pnpm", "--filter", "express-app", "db:deploy"]
    environment:
      DATABASE_URL: "postgresql://express:express@db:5432/express_app"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: express
      POSTGRES_PASSWORD: express
      POSTGRES_DB: express_app
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U express -d express_app"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
  prisma_client:
